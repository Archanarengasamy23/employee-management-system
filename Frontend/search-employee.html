<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Employee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h1>Search Employee</h1>
  </div>

  <div class="container" style="max-width: 900px;">

    <input type="text" id="searchInput" placeholder="Search by name...">
    <button id="searchBtn" class="menu-btn">Search</button>

    <br><br>

    <table id="searchResultTable" border="1" cellpadding="10" style="width:100%; border-collapse: collapse;">
      <thead>
        <tr>
          <th>Name</th>
          <th>Designation</th>
          <th>Department</th>
          <th>Salary</th>
          <th>Email</th>
          <th>Phone</th>
        </tr>
      </thead>
      <tbody>
        <!-- Search results will show here -->
      </tbody>
    </table>

    <br>
    <a href="index.html" class="menu-btn">Back to Home</a>
  </div>
 <script src="script.js"></script>
</body>
</html>
