<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Employee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <h1>Add Employee</h1>
  </div>

  <div class="container">
    <form id="addEmployeeForm">
      <input type="text" id="name" placeholder="Employee Name" required><br><br>
      <input type="text" id="designation" placeholder="Designation" required><br><br>
      <input type="text" id="department" placeholder="Department" required><br><br>
      <input type="number" id="salary" placeholder="Salary" required><br><br>
      <input type="email" id="email" placeholder="Email" required><br><br>
      <input type="text" id="phone" placeholder="Phone Number" required><br><br>

      <button type="submit" class="menu-btn">Add Employee</button>
    </form>

    <br>
    <a href="index.html" class="menu-btn">Back to Home</a>
  </div>
<script src="script.js"></script>
</body>
</html>
